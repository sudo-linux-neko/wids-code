[package]
name = "nvda_monte_carlo"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pure-Rust Vulkan compute backend (compiles cleanly on x86_64-pc-windows-gnu without MSVC)
wgpu = { version = "22.1.0", default-features = false, features = ["wgsl"] }
pollster = "0.3"
bytemuck = { version = "1.18", features = ["derive"] }
indicatif = "0.17"
sysinfo = "0.31"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true